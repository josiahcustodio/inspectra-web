services:
  - type: web
    name: inspectra-admin
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # SPA fallback: client-side routes like /admin/dashboard must all serve
    # index.html, otherwise a page refresh on any route returns a 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Values are entered once in the Render dashboard (sync: false), then
    # baked into the JS bundle at build time by Vite.
    envVars:
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MEASUREMENT_ID
        sync: false
